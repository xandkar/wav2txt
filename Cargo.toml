[package]
name = "aud2txt"
version = "0.5.0"
edition = "2021"
description = "Audio to text tool using ggerganov's whisper.cpp"
repository = "https://github.com/xandkar/aud2txt"
authors = ["Siraaj Khandkar <siraaj@khandkar.net>"]
keywords = ["audio", "text", "llm", "whisper"]
categories = ["command-line-utilities"]
license-file = "LICENSE"
readme = "README.md"

[dependencies]
anyhow = { version = "1.0.71", features = ["backtrace"] }
clap = { version = "4.3.0", features = ["derive"] }
dirs = "6.0.0"
hound = "3.5.0"
reqwest = { version = "0.12.15", features = ["blocking"] }
tempfile = "3.19.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
whisper-rs = { version = "0.8.0" }
